<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>ASCEND — Eleve sua vida</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="./icon.svg"><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f8f5ef;background:#080a0f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#282015 0%,#0b0d12 40%,#07090d 100%);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100dvh;padding:24px 18px 105px}.gold{color:#eec575}.muted{color:#a8a8ad}.brand{letter-spacing:5px;color:#f1cc81;font-size:29px;font-weight:500}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#f9d78b,#765020);display:grid;place-items:center;color:#17100a;font-weight:800}.card{border:1px solid #51402a;background:linear-gradient(145deg,#19191c,#0c0e13);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 8px 30px #0005}.btn{border:1px solid #bc9047;background:linear-gradient(110deg,#bd8733,#ffe49b,#b77d2e);border-radius:24px;color:#17110a;font-weight:750;padding:13px 17px}.outline{background:#121317;color:#e6c27b;border:1px solid #7d6237}.wide{width:100%}.title{font-size:25px;font-weight:700;margin:12px 0 5px}.small{font-size:12px}.progress{height:9px;background:#292a2c;border-radius:12px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#ad7629,#ffde8c);border-radius:12px}.pyramid{width:100%;max-width:365px;margin:20px auto 8px;filter:drop-shadow(0 0 20px #bd791c40)}.tier{margin:0 auto 3px;height:58px;display:grid;place-items:center;color:#fff0c5;font-weight:700;font-size:13px;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);background:linear-gradient(120deg,#36230d,#c08a35 48%,#281b10);border-top:2px solid #f6d58a;box-shadow:inset 0 0 20px #e3a73577;cursor:pointer}.tier:first-child{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:19px}.tier.active{background:linear-gradient(120deg,#8a5316,#ffe098,#8a5316);color:#231507}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:#0b0c10f5;border-top:1px solid #6a512c;display:flex;justify-content:space-around;padding:12px 5px max(14px,env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:#aaa;display:grid;gap:4px;place-items:center;font-size:10px}.nav button.active{color:#f3cb7a}.nav b{font-size:21px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dream{border:1px solid #58452b;background:#16171b;border-radius:14px;overflow:hidden;cursor:pointer}.dream .pic{height:112px;display:grid;place-items:center;background:radial-gradient(circle at center,#60451f,#15171d);font-size:52px}.dream .info{padding:10px}.field{width:100%;background:#15161b;border:1px solid #5a4b36;border-radius:12px;color:white;padding:13px;margin:6px 0 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:14px;border:1px solid #443a2d;background:#15161b;border-radius:12px;margin:9px 0}.hide{display:none}.pill{display:inline-block;border:1px solid #75572b;border-radius:20px;padding:5px 10px;color:#efca82;font-size:11px}.hero{text-align:center;padding:30px 10px}.mountain{font-size:95px;filter:drop-shadow(0 0 35px #b78c43)}.center{text-align:center}.empty{padding:20px;color:#aaa;text-align:center}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e9c47c;color:#111;padding:10px 20px;border-radius:18px;z-index:9;display:none}

/* ASCEND visual system v3 */
:root{color-scheme:dark;--gold:#e8bc67;--muted:#a5a7af}
body{background:radial-gradient(ellipse 70% 40% at 50% -5%,#3d2b17 0%,#151316 44%,#08090e 100%);background-attachment:fixed}
.app{padding:22px 19px 120px}
.brand{font-family:Georgia,serif;font-size:23px;letter-spacing:6px;text-shadow:0 0 25px #e9b85c6e}
.top{padding:4px 0 12px;border-bottom:1px solid #3e3327;margin-bottom:21px}
.avatar{border:2px solid #e4bc70;box-shadow:0 0 19px #c4934155}
.title{font-size:27px;letter-spacing:-.6px}
.card{background:linear-gradient(140deg,#1e1a19 0%,#111217 65%,#0d1017 100%);border:1px solid #6d522f88;border-radius:19px;box-shadow:0 10px 28px #0007,inset 0 1px #f4d49318;padding:18px}
.card h3{color:#f4d492}
.btn{box-shadow:inset 0 1px 1px #fff8,0 5px 18px #d29b3222;transition:transform .18s,filter .18s}
.btn:active{transform:scale(.97)}
.outline{box-shadow:none}
.nav{background:linear-gradient(180deg,#131318f5,#07090dfb);box-shadow:0 -8px 30px #0009;border-top:1px solid #a0783a77;backdrop-filter:blur(15px)}
.nav button{min-width:54px}.nav button.active b{color:#ffda83;text-shadow:0 0 16px #f7bd5b}.nav button b{font-size:24px}
.pyramid{max-width:400px;margin:4px auto 20px;filter:drop-shadow(0 0 20px #e5a84550)}
.pyramid svg{display:block;width:100%;overflow:visible}
.pyramid .p-level{cursor:pointer;transition:filter .2s,opacity .2s}
.pyramid .p-level:active{filter:brightness(1.5)}
.dream{border:1px solid #81613770;box-shadow:0 8px 24px #0007;border-radius:17px}
.dream .pic{height:125px;background:radial-gradient(ellipse at 45% 25%,#72542d,#242028 52%,#0c1016);text-shadow:0 4px 25px #f3bd6450;font-size:57px}
.dream .info{padding:13px}.dream b{font-size:13px}
.item{border:1px solid #68513770;background:linear-gradient(110deg,#211c19,#12151b);border-radius:15px}
.field{background:#111318;border-color:#79613e;border-radius:14px}
.progress{height:10px;box-shadow:inset 0 1px 4px #000}
.progress>div{background:linear-gradient(90deg,#aa7123,#e8b752,#ffe8a1);box-shadow:0 0 10px #e6b95b55}
.hero{padding-top:55px}.mountain{color:#e9bc69;text-shadow:0 0 50px #e8a84c}
.pill{background:#48331950}
@media(min-width:700px){.app{max-width:550px}.nav{max-width:550px}}
.verse-card{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 0%,#72501d88,transparent 52%),linear-gradient(155deg,#261b13,#11141c 72%);border:1px solid #c59a51;border-radius:22px;padding:24px 20px;margin:16px 0;box-shadow:0 0 28px #d49b3024}.verse-card:before{content:'✦';position:absolute;right:18px;top:12px;color:#f0c77d99;font-size:32px}.verse-label{color:#e8bd6b;font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.verse-quote{font-family:Georgia,serif;font-size:23px;line-height:1.45;color:#fff0cc;margin:20px 0}.verse-ref{color:#e6bb6b;font-weight:700}.verse-explanation{background:#ffffff09;border-left:3px solid #d4a551;border-radius:0 12px 12px 0;padding:14px;margin:15px 0;line-height:1.6}.brand-footer{margin:35px 0 5px;text-align:center;color:#c6a368;font-size:10px;letter-spacing:2px}.brand-footer strong{font-size:12px;color:#e7c37a}</style></head><body><main class="app" id="app"></main><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div><script>
const KEY='ascend-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){};data=data||{name:'',levels:['Deus','Família','Saúde','Carreira','Finanças','Sonhos & Conquistas'],dreams:[{id:1,name:'Meu carro (BMW X1)',emoji:'🚙',target:250000,saved:145000,category:'Sonhos & Conquistas',tasks:['Pesquisar melhores condições','Revisar orçamento mensal']},{id:2,name:'Casa própria',emoji:'🏡',target:500000,saved:185000,category:'Família',tasks:[]},{id:3,name:'Sorriso dos sonhos',emoji:'😁',target:12000,saved:8400,category:'Saúde',tasks:[]},{id:4,name:'Cuidar do cabelo',emoji:'💇',target:3000,saved:1350,category:'Saúde',tasks:[]},{id:5,name:'Viajar pelo mundo',emoji:'🏝️',target:30000,saved:6000,category:'Sonhos & Conquistas',tasks:[]}],done:[],tasksDone:[]};data.sections=data.sections||{};let page=data.name?'home':'welcome',selected=1,selectedLevel='Deus';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});const pct=d=>d.target?Math.min(100,Math.round(d.saved/d.target*100)):0;function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function go(p,id){page=p;if(id!==undefined)selected=id;render();scrollTo(0,0)}function head(t,sub=''){return '<div class="top"><div><div class="brand">ASCEND</div><div class="muted small">'+esc(sub)+'</div></div><div class="avatar">'+esc((data.name||'A')[0].toUpperCase())+'</div></div><h1 class="title">'+t+'</h1>'}function bar(n){return '<div class="progress"><div style="width:'+n+'%"></div></div>'}function pyramid(){const n=data.levels.length;const top=18,step=57,base=350,cx=190,scale=base/(n*step);const shapes=data.levels.map((l,i)=>{const y1=top+i*step,y2=y1+step-3,w1=(i+0.3)*step*scale,w2=(i+1.3)*step*scale;const x1=cx-w1/2,x2=cx+w1/2,x3=cx+w2/2,x4=cx-w2/2;const points=[x1+','+y1,x2+','+y1,x3+','+y2,x4+','+y2].join(' ');return '<g class="p-level" onclick="openLevel('+i+')"><polygon points="'+points+'" fill="url(#pFill)" stroke="#f7cf7b" stroke-width="2.2"/><path d="M'+(x1+4)+' '+(y1+4)+' L'+(x4+4)+' '+(y2-4)+'" stroke="#ffe1a0" opacity=".25" fill="none"/><text x="'+cx+'" y="'+(y1+step/2+5)+'" text-anchor="middle" fill="#fff0cc" font-size="'+(l.length>17?10:13)+'" font-weight="700">'+esc(l.toUpperCase())+'</text></g>'}).join('');return '<div class="pyramid"><svg viewBox="0 0 380 '+(top+n*step+15)+'" role="img" aria-label="Pirâmide de prioridades interativa"><defs><linearGradient id="pFill" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#2c1a0c"/><stop offset=".48" stop-color="#a66d20"/><stop offset=".55" stop-color="#543315"/><stop offset="1" stop-color="#110f11"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs><path d="M190 15 L365 '+(top+n*step)+' H15 Z" stroke="#f3c15f" stroke-width="6" opacity=".25" fill="none" filter="url(#glow)"/>'+shapes+'</svg></div>'}function dreamCard(d){return '<div class="dream" onclick="go(\'detail\','+d.id+')"><div class="pic">'+esc(d.emoji)+'</div><div class="info"><b>'+esc(d.name)+'</b>'+bar(pct(d))+'<div class="row small"><span class="muted">'+esc(d.category)+'</span><span class="gold">'+pct(d)+'%</span></div></div></div>'}function nav(){const links=[['home','⌂','Início'],['levels','△','Pirâmide'],['add','＋','Adicionar'],['dreams','♡','Sonhos'],['profile','♙','Perfil']];$('nav').style.display=['welcome','register'].includes(page)?'none':'flex';$('nav').innerHTML=links.map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')"><b>'+i+'</b>'+t+'</button>').join('')}function render(){nav();let h='';const total=data.dreams.length,done=data.dreams.filter(d=>pct(d)===100).length,average=total?Math.round(data.dreams.reduce((a,d)=>a+pct(d),0)/total):0;
if(page==='welcome')h='<section class="hero"><div class="mountain">△</div><div class="brand" style="font-size:42px">ASCEND</div><h2>Eleve sua vida.</h2><p class="gold">Fé • Prioridades • Sonhos • Conquistas</p><div style="height:70px"></div><button class="btn wide" onclick="go(\'register\')">Criar conta</button><p><button class="btn outline wide" onclick="go(\'register\')">Entrar na demonstração</button></p><p class="muted small">Protótipo local. Cadastro real será integrado posteriormente.</p></section>';
else if(page==='register')h='<div class="hero"><div class="mountain" style="font-size:55px">△</div><h1>Criar perfil de demonstração</h1><p class="muted">Seus dados serão guardados neste navegador.</p></div><form onsubmit="event.preventDefault();data.name=this.elements.nome.value.trim();save();go(\'home\')"><label>Nome completo</label><input class="field" name="nome" required placeholder="Seu nome"><button class="btn wide">Começar minha jornada</button></form>';
else if(page==='home')h=head('Olá, '+esc(data.name.split(' ')[0])+'! ✨','Sua evolução está no caminho certo.')+'<div class="card"><div class="row"><b>Evolução geral</b><strong class="gold">'+average+'%</strong></div>'+bar(average)+'</div>'+pyramid()+'<div class="grid"><div class="card center"><h2 class="gold">'+total+'</h2><span class="small">Objetivos</span></div><div class="card center"><h2 class="gold">'+done+'</h2><span class="small">Conquistas</span></div></div><button class="btn wide" onclick="go(\'levels\')">Personalizar minha pirâmide</button>';
else if(page==='levels')h=head('Minha Pirâmide','Toque no nome para abrir. Use as setas para ordenar.')+data.levels.map((l,i)=>'<div class="item row"><span class="gold">'+(i+1)+'.</span><b style="flex:1">'+esc(l)+'</b><button class="btn outline" onclick="move('+i+',-1)">↑</button><button class="btn outline" onclick="move('+i+',1)">↓</button><button class="btn outline" onclick="renameLevel('+i+')">✎</button><button class="btn outline" onclick="removeLevel('+i+')">×</button></div>').join('')+'<button class="btn wide" onclick="addLevel()">＋ Adicionar nível</button><p class="muted small">Toque no nome de cada prioridade para abrir seu espaço pessoal.</p>';
else if(page==='section'){const level=selectedLevel;const s=data.sections[level]||(data.sections[level]={notes:'',purposes:[],fasts:[],reading:[]});const spiritual=/deus|fé|espiritual|cristo|jesus/i.test(level);h=head(esc(level),'Meu espaço pessoal • prioridades')+'<div class="card"><h3>✦ Minha jornada</h3><p class="muted small">Registre pensamentos, planos e tudo que é importante para você.</p><textarea id="section-notes" class="field" rows="4" placeholder="Escreva livremente...">'+esc(s.notes)+'</textarea><button class="btn wide" onclick="saveNotes()">Salvar anotações</button></div>';if(spiritual){h+=verseCard();h+='<div class="card"><h3>📖 Bíblia</h3><p class="muted">Acesse a leitura bíblica e registre suas passagens favoritas.</p><a class="btn wide" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.bible.com/pt/bible/129/GEN.1.NVI">Abrir Bíblia em português ↗</a><p><button class="btn outline wide" onclick="addSectionItem(\'reading\',\'Qual passagem deseja registrar?\')">＋ Registrar leitura bíblica</button></p>'+sectionItems('reading',s)+'</div><div class="card"><h3>🙏 Propósitos e orações</h3><p class="muted small">Defina seu propósito, período e acompanhe cada etapa.</p><button class="btn wide" onclick="addSectionItem(\'purposes\',\'Qual é seu propósito ou oração?\')">＋ Novo propósito</button>'+sectionItems('purposes',s)+'</div><div class="card"><h3>🌿 Jejum</h3><p class="muted small">Registre sua intenção, período e reflexões. Jejum alimentar exige atenção à saúde e não é indicado para todas as pessoas.</p><button class="btn wide" onclick="addSectionItem(\'fasts\',\'Qual jejum ou prática espiritual deseja registrar?\')">＋ Registrar jejum</button>'+sectionItems('fasts',s)+'</div>'}else{h+='<div class="card"><h3>🎯 Objetivos desta área</h3><button class="btn wide" onclick="addSectionItem(\'purposes\',\'Qual objetivo deseja registrar?\')">＋ Novo objetivo</button>'+sectionItems('purposes',s)+'</div><div class="card"><h3>✓ Hábitos e compromissos</h3><button class="btn outline wide" onclick="addSectionItem(\'reading\',\'Qual hábito ou compromisso?\')">＋ Adicionar hábito</button>'+sectionItems('reading',s)+'</div>'}h+='<h3>Sonhos vinculados</h3><div class="grid">'+data.dreams.filter(d=>d.category===level).map(dreamCard).join('')+'</div><p><button class="btn outline wide" onclick="go(\'levels\')">Voltar à pirâmide</button></p>';}
else if(page==='dreams')h=head('Sonhos & Conquistas','Transforme desejos em realidade.')+'<div class="grid">'+data.dreams.map(dreamCard).join('')+'</div><p><button class="btn wide" onclick="go(\'add\')">＋ Adicionar sonho</button></p>';
else if(page==='add')h=head('Novo Sonho','O primeiro passo para conquistar.')+'<form onsubmit="createDream(event)"><label>Nome do sonho</label><input class="field" name="nome" required placeholder="Ex.: Meu carro novo"><label>Ícone ou emoji</label><input class="field" name="emoji" placeholder="🚙" maxlength="8"><label>Área da vida</label><select class="field" name="category">'+data.levels.map(l=>'<option>'+esc(l)+'</option>').join('')+'</select><label>Valor da meta (R$)</label><input class="field" type="number" min="0" step="0.01" name="target" placeholder="50000"><label>Quanto já tenho (R$)</label><input class="field" type="number" min="0" step="0.01" name="saved" placeholder="0"><button class="btn wide">Salvar meu sonho</button></form>';
else if(page==='detail'){const d=data.dreams.find(x=>x.id===selected);if(!d){go('dreams');return}h=head('Detalhe do Sonho','Meu plano de conquista')+'<div class="card center"><div style="font-size:90px">'+esc(d.emoji)+'</div><h2>'+esc(d.name)+'</h2><span class="pill">'+esc(d.category)+'</span></div><div class="card"><div class="row"><span>Meta</span><b>'+money(d.target)+'</b></div><div class="row"><span>Reservado</span><b>'+money(d.saved)+'</b></div>'+bar(pct(d))+'<div class="gold center">'+pct(d)+'% concluído</div></div><div class="row"><button class="btn" onclick="addValue('+d.id+')">＋ Adicionar valor</button><button class="btn outline" onclick="editDream('+d.id+')">Editar</button></div><h3>Plano de Ação</h3>'+d.tasks.map((t,i)=>'<div class="item"><label><input type="checkbox" '+(data.tasksDone.includes(d.id+':'+i)?'checked':'')+' onchange="toggleTask('+d.id+','+i+')"> '+esc(t)+'</label></div>').join('')+'<button class="btn outline wide" onclick="addTask('+d.id+')">＋ Adicionar tarefa</button><p><button class="btn outline wide" onclick="deleteDream('+d.id+')">Excluir sonho</button></p>'}
else if(page==='profile')h=head('Meu Perfil','Preferências e segurança')+'<div class="card center"><div class="avatar" style="margin:auto;width:75px;height:75px;font-size:30px">'+esc(data.name[0]||'A')+'</div><h2>'+esc(data.name)+'</h2><span class="pill">Membro ASCEND</span></div><div class="item">Meus objetivos: '+total+'</div><div class="item">Conquistas: '+done+'</div><div class="item">Evolução média: '+average+'%</div><button class="btn outline wide" onclick="go(\'evolution\')">Ver minha evolução</button><p><button class="btn outline wide" onclick="go(\'community\')">Comunidade ASCEND</button></p><p class="muted small">Esta versão é uma demonstração local, sem autenticação online.</p>';
else if(page==='evolution')h=head('Minha Evolução','Seu progresso por objetivo')+data.dreams.map(d=>'<div class="card"><div class="row"><b>'+esc(d.name)+'</b><span class="gold">'+pct(d)+'%</span></div>'+bar(pct(d))+'</div>').join('');
else if(page==='community')h=head('Comunidade ASCEND','Um espaço para inspirar conquistas')+'<div class="card"><h3>Em desenvolvimento</h3><p class="muted">A comunidade será ativada quando houver cadastro seguro, perfis e controles de privacidade.</p></div>';
$('app').innerHTML=h+'<div class="brand-footer">DESENVOLVIDO POR <strong>AUREON TECH</strong><br>ASCEND • ELEVE SUA VIDA</div>'}
const DAILY_VERSES=[{ref:'Salmos 23:1',quote:'O Senhor é o meu pastor; nada me faltará.',explanation:'Este salmo fala de confiança e cuidado. Mesmo em dias incertos, você pode buscar direção, serenidade e gratidão, lembrando que não precisa enfrentar tudo sozinho.',action:'Hoje, anote uma preocupação e uma coisa pela qual você é grato.'},{ref:'Filipenses 4:13',quote:'Posso todas as coisas naquele que me fortalece.',explanation:'No contexto, Paulo fala sobre encontrar força em Cristo para enfrentar tanto a abundância quanto a necessidade. Não é uma promessa de sucesso em qualquer desejo, mas de perseverança em circunstâncias diferentes.',action:'Escolha um desafio de hoje e dê o primeiro passo com coragem.'},{ref:'Provérbios 3:5',quote:'Confia no Senhor de todo o teu coração.',explanation:'A sabedoria bíblica convida a confiar em Deus e reconhecer os limites do próprio entendimento. É um convite à humildade e a decisões refletidas.',action:'Antes de uma decisão importante, reserve alguns minutos para orar e refletir.'},{ref:'Salmos 46:1',quote:'Deus é o nosso refúgio e fortaleza.',explanation:'O salmo apresenta Deus como fonte de segurança em meio às dificuldades. Refúgio não significa ausência de problemas, mas um lugar de esperança e firmeza.',action:'Faça uma pausa e identifique onde você precisa de apoio hoje.'},{ref:'Mateus 6:34',quote:'Não vos inquieteis, pois, pelo dia de amanhã.',explanation:'Jesus ensina a não deixar que a ansiedade pelo futuro domine o presente. O texto não dispensa planejamento: convida a viver um dia de cada vez.',action:'Escreva uma ação possível para hoje e deixe o restante para planejar depois.'},{ref:'Salmos 37:5',quote:'Entrega o teu caminho ao Senhor; confia nele.',explanation:'O versículo associa confiança à entrega dos caminhos a Deus. É uma chamada à fidelidade e à paciência, não uma garantia de resultados imediatos.',action:'Reflita sobre um plano e qual atitude responsável você pode tomar.'},{ref:'Isaías 41:10',quote:'Não temas, porque eu sou contigo.',explanation:'Esta mensagem de encorajamento foi dirigida ao povo de Israel em um contexto de dificuldades. Ela inspira a lembrar da presença e do amparo de Deus diante do medo.',action:'Pense em algo que causa receio e procure uma forma segura de enfrentá-lo.'}];function dailyVerse(){const now=new Date(),start=new Date(now.getFullYear(),0,1),day=Math.floor((now-start)/86400000);return DAILY_VERSES[day%DAILY_VERSES.length]}function verseText(){const v=dailyVerse();return '✦ PALAVRA DO DIA — ASCEND\\n\\n“'+v.quote+'”\\n'+v.ref+'\\n\\nReflexão: '+v.explanation+'\\n\\nPara hoje: '+v.action+'\\n\\nASCEND • AUREON TECH'}function verseCard(){const v=dailyVerse();return '<div class="verse-card"><div class="verse-label">✦ Palavra para o seu dia</div><div class="muted small" style="margin-top:6px">'+new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long'})+'</div><div class="verse-quote">“'+esc(v.quote)+'”</div><div class="verse-ref">'+esc(v.ref)+'</div><h3 style="margin-top:24px;color:#f0cc88">O que essa palavra nos ensina?</h3><div class="verse-explanation">'+esc(v.explanation)+'</div><div class="muted small"><b class="gold">Para praticar hoje:</b> '+esc(v.action)+'</div><div class="row" style="margin-top:22px"><button class="btn" onclick="shareVerse()">↗ Compartilhar</button><button class="btn outline" onclick="copyVerse()">⧉ Copiar</button></div><p class="muted small center">Reflexão original do ASCEND. Confira o contexto completo na Bíblia.</p></div>'}async function shareVerse(){const t=verseText();if(navigator.share){try{await navigator.share({title:'Palavra do dia • ASCEND',text:t});return}catch(e){if(e.name==='AbortError')return}}copyVerse()}async function copyVerse(){try{await navigator.clipboard.writeText(verseText());toast('Palavra copiada para compartilhar')}catch(e){prompt('Copie a palavra do dia:',verseText())}}function openLevel(i){selectedLevel=data.levels[i];go('section')}function saveNotes(){data.sections[selectedLevel]=data.sections[selectedLevel]||{notes:'',purposes:[],fasts:[],reading:[]};data.sections[selectedLevel].notes=document.getElementById('section-notes').value;save();toast('Anotações salvas')}function sectionItems(type,s){return (s[type]||[]).map((x,i)=>'<div class="item row"><label style="flex:1"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleSectionItem(\''+type+'\','+i+')"> '+esc(x.text)+'</label><button class="btn outline" onclick="deleteSectionItem(\''+type+'\','+i+')">×</button></div>').join('')}function addSectionItem(type,msg){let v=prompt(msg);if(!v?.trim())return;let s=data.sections[selectedLevel]||(data.sections[selectedLevel]={notes:'',purposes:[],fasts:[],reading:[]});s[type]=s[type]||[];s[type].push({text:v.trim(),done:false,date:new Date().toISOString()});save();render()}function toggleSectionItem(type,i){let x=data.sections[selectedLevel][type][i];x.done=!x.done;save();render()}function deleteSectionItem(type,i){if(!confirm('Excluir este registro?'))return;data.sections[selectedLevel][type].splice(i,1);save();render()}function move(i,step){let j=i+step;if(j<0||j>=data.levels.length)return;[data.levels[i],data.levels[j]]=[data.levels[j],data.levels[i]];save();render()}function renameLevel(i){let v=prompt('Novo nome do nível',data.levels[i]);if(v?.trim()){data.levels[i]=v.trim();save();render()}}function addLevel(){let v=prompt('Nome do novo nível');if(v?.trim()){data.levels.push(v.trim());save();render()}}function removeLevel(i){if(confirm('Excluir este nível? Os sonhos existentes serão mantidos.')){data.levels.splice(i,1);save();render()}}function createDream(e){e.preventDefault();const f=e.target;let d={id:Date.now(),name:f.elements.nome.value.trim(),emoji:f.elements.emoji.value.trim()||'⭐',category:f.elements.category.value,target:Number(f.elements.target.value)||0,saved:Number(f.elements.saved.value)||0,tasks:[]};data.dreams.push(d);save();go('detail',d.id)}function addValue(id){let d=data.dreams.find(x=>x.id===id),v=prompt('Quanto deseja adicionar em R$?');if(v!==null&&Number(v.replace(',','.'))>0){d.saved+=Number(v.replace(',','.'));save();render()}}function editDream(id){let d=data.dreams.find(x=>x.id===id),v=prompt('Nome do sonho',d.name);if(v?.trim()){d.name=v.trim();save();render()}}function addTask(id){let d=data.dreams.find(x=>x.id===id),v=prompt('Nova tarefa');if(v?.trim()){d.tasks.push(v.trim());save();render()}}function toggleTask(id,i){let k=id+':'+i;data.tasksDone=data.tasksDone.includes(k)?data.tasksDone.filter(x=>x!==k):[...data.tasksDone,k];save()}function deleteDream(id){if(confirm('Excluir este sonho?')){data.dreams=data.dreams.filter(x=>x.id!==id);save();go('dreams')}}render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('install-app');if(b)b.style.display='block'});async function installAscend(){if(!installPrompt){alert('No Android, abra o menu do Chrome e escolha Instalar app ou Adicionar à tela inicial. No iPhone, use Compartilhar > Adicionar à Tela de Início.');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}</script><button id="install-app" onclick="installAscend()" style="position:fixed;right:12px;top:10px;z-index:8;border:1px solid #b98c43;background:#19150e;color:#f7d68d;border-radius:18px;padding:8px 12px;font-size:11px">⬇ Instalar ASCEND</button></body></html>
