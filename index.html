<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>ASCEND — Eleve sua vida</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="./icon.svg"><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f8f5ef;background:#080a0f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#282015 0%,#0b0d12 40%,#07090d 100%);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100dvh;padding:24px 18px 105px}.gold{color:#eec575}.muted{color:#a8a8ad}.brand{letter-spacing:5px;color:#f1cc81;font-size:29px;font-weight:500}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#f9d78b,#765020);display:grid;place-items:center;color:#17100a;font-weight:800}.card{border:1px solid #51402a;background:linear-gradient(145deg,#19191c,#0c0e13);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 8px 30px #0005}.btn{border:1px solid #bc9047;background:linear-gradient(110deg,#bd8733,#ffe49b,#b77d2e);border-radius:24px;color:#17110a;font-weight:750;padding:13px 17px}.outline{background:#121317;color:#e6c27b;border:1px solid #7d6237}.wide{width:100%}.title{font-size:25px;font-weight:700;margin:12px 0 5px}.small{font-size:12px}.progress{height:9px;background:#292a2c;border-radius:12px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#ad7629,#ffde8c);border-radius:12px}.pyramid{width:100%;max-width:365px;margin:20px auto 8px;filter:drop-shadow(0 0 20px #bd791c40)}.tier{margin:0 auto 3px;height:58px;display:grid;place-items:center;color:#fff0c5;font-weight:700;font-size:13px;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);background:linear-gradient(120deg,#36230d,#c08a35 48%,#281b10);border-top:2px solid #f6d58a;box-shadow:inset 0 0 20px #e3a73577;cursor:pointer}.tier:first-child{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:19px}.tier.active{background:linear-gradient(120deg,#8a5316,#ffe098,#8a5316);color:#231507}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:#0b0c10f5;border-top:1px solid #6a512c;display:flex;justify-content:space-around;padding:12px 5px max(14px,env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:#aaa;display:grid;gap:4px;place-items:center;font-size:10px}.nav button.active{color:#f3cb7a}.nav b{font-size:21px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dream{border:1px solid #58452b;background:#16171b;border-radius:14px;overflow:hidden;cursor:pointer}.dream .pic{height:112px;display:grid;place-items:center;background:radial-gradient(circle at center,#60451f,#15171d);font-size:52px}.dream .info{padding:10px}.field{width:100%;background:#15161b;border:1px solid #5a4b36;border-radius:12px;color:white;padding:13px;margin:6px 0 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:14px;border:1px solid #443a2d;background:#15161b;border-radius:12px;margin:9px 0}.hide{display:none}.pill{display:inline-block;border:1px solid #75572b;border-radius:20px;padding:5px 10px;color:#efca82;font-size:11px}.hero{text-align:center;padding:30px 10px}.mountain{font-size:95px;filter:drop-shadow(0 0 35px #b78c43)}.center{text-align:center}.empty{padding:20px;color:#aaa;text-align:center}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e9c47c;color:#111;padding:10px 20px;border-radius:18px;z-index:9;display:none}
</style></head><body><main class="app" id="app"></main><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div><script>
const KEY='ascend-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){};data=data||{name:'',levels:['Deus','Família','Saúde','Carreira','Finanças','Sonhos & Conquistas'],dreams:[{id:1,name:'Meu carro (BMW X1)',emoji:'🚙',target:250000,saved:145000,category:'Sonhos & Conquistas',tasks:['Pesquisar melhores condições','Revisar orçamento mensal']},{id:2,name:'Casa própria',emoji:'🏡',target:500000,saved:185000,category:'Família',tasks:[]},{id:3,name:'Sorriso dos sonhos',emoji:'😁',target:12000,saved:8400,category:'Saúde',tasks:[]},{id:4,name:'Cuidar do cabelo',emoji:'💇',target:3000,saved:1350,category:'Saúde',tasks:[]},{id:5,name:'Viajar pelo mundo',emoji:'🏝️',target:30000,saved:6000,category:'Sonhos & Conquistas',tasks:[]}],done:[],tasksDone:[]};data.sections=data.sections||{};let page=data.name?'home':'welcome',selected=1,selectedLevel='Deus';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});const pct=d=>d.target?Math.min(100,Math.round(d.saved/d.target*100)):0;function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function go(p,id){page=p;if(id!==undefined)selected=id;render();scrollTo(0,0)}function head(t,sub=''){return '<div class="top"><div><div class="brand">ASCEND</div><div class="muted small">'+esc(sub)+'</div></div><div class="avatar">'+esc((data.name||'A')[0].toUpperCase())+'</div></div><h1 class="title">'+t+'</h1>'}function bar(n){return '<div class="progress"><div style="width:'+n+'%"></div></div>'}function pyramid(){return '<div class="pyramid">'+data.levels.map((l,i)=>'<div onclick="openLevel('+i+')" class="tier" style="width:'+(31+i*13)+'%">'+esc(l)+'</div>').join('')+'</div>'}function dreamCard(d){return '<div class="dream" onclick="go(\'detail\','+d.id+')"><div class="pic">'+esc(d.emoji)+'</div><div class="info"><b>'+esc(d.name)+'</b>'+bar(pct(d))+'<div class="row small"><span class="muted">'+esc(d.category)+'</span><span class="gold">'+pct(d)+'%</span></div></div></div>'}function nav(){const links=[['home','⌂','Início'],['levels','△','Pirâmide'],['add','＋','Adicionar'],['dreams','♡','Sonhos'],['profile','♙','Perfil']];$('nav').style.display=['welcome','register'].includes(page)?'none':'flex';$('nav').innerHTML=links.map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" onclick="go(\''+p+'\')"><b>'+i+'</b>'+t+'</button>').join('')}function render(){nav();let h='';const total=data.dreams.length,done=data.dreams.filter(d=>pct(d)===100).length,average=total?Math.round(data.dreams.reduce((a,d)=>a+pct(d),0)/total):0;
if(page==='welcome')h='<section class="hero"><div class="mountain">△</div><div class="brand" style="font-size:42px">ASCEND</div><h2>Eleve sua vida.</h2><p class="gold">Fé • Prioridades • Sonhos • Conquistas</p><div style="height:70px"></div><button class="btn wide" onclick="go(\'register\')">Criar conta</button><p><button class="btn outline wide" onclick="go(\'register\')">Entrar na demonstração</button></p><p class="muted small">Protótipo local. Cadastro real será integrado posteriormente.</p></section>';
else if(page==='register')h='<div class="hero"><div class="mountain" style="font-size:55px">△</div><h1>Criar perfil de demonstração</h1><p class="muted">Seus dados serão guardados neste navegador.</p></div><form onsubmit="event.preventDefault();data.name=this.elements.nome.value.trim();save();go(\'home\')"><label>Nome completo</label><input class="field" name="nome" required placeholder="Seu nome"><button class="btn wide">Começar minha jornada</button></form>';
else if(page==='home')h=head('Olá, '+esc(data.name.split(' ')[0])+'! ✨','Sua evolução está no caminho certo.')+'<div class="card"><div class="row"><b>Evolução geral</b><strong class="gold">'+average+'%</strong></div>'+bar(average)+'</div>'+pyramid()+'<div class="grid"><div class="card center"><h2 class="gold">'+total+'</h2><span class="small">Objetivos</span></div><div class="card center"><h2 class="gold">'+done+'</h2><span class="small">Conquistas</span></div></div><button class="btn wide" onclick="go(\'levels\')">Personalizar minha pirâmide</button>';
else if(page==='levels')h=head('Minha Pirâmide','Arraste suas prioridades com os botões.')+data.levels.map((l,i)=>'<div class="item row"><span class="gold">'+(i+1)+'.</span><b style="flex:1">'+esc(l)+'</b><button class="btn outline" onclick="move('+i+',-1)">↑</button><button class="btn outline" onclick="move('+i+',1)">↓</button><button class="btn outline" onclick="renameLevel('+i+')">✎</button><button class="btn outline" onclick="removeLevel('+i+')">×</button></div>').join('')+'<button class="btn wide" onclick="addLevel()">＋ Adicionar nível</button><p class="muted small">Toque no nome de cada prioridade para abrir seu espaço pessoal.</p>';
else if(page==='section'){const level=selectedLevel;const s=data.sections[level]||(data.sections[level]={notes:'',purposes:[],fasts:[],reading:[]});const spiritual=/deus|fé|espiritual|cristo|jesus/i.test(level);h=head(esc(level),'Meu espaço pessoal • prioridades')+'<div class="card"><h3>✦ Minha jornada</h3><p class="muted small">Registre pensamentos, planos e tudo que é importante para você.</p><textarea id="section-notes" class="field" rows="4" placeholder="Escreva livremente...">'+esc(s.notes)+'</textarea><button class="btn wide" onclick="saveNotes()">Salvar anotações</button></div>';if(spiritual){h+='<div class="card"><h3>📖 Bíblia</h3><p class="muted">Acesse a leitura bíblica e registre suas passagens favoritas.</p><a class="btn wide" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.bible.com/pt/bible/129/GEN.1.NVI">Abrir Bíblia em português ↗</a><p><button class="btn outline wide" onclick="addSectionItem(\'reading\',\'Qual passagem deseja registrar?\')">＋ Registrar leitura bíblica</button></p>'+sectionItems('reading',s)+'</div><div class="card"><h3>🙏 Propósitos e orações</h3><p class="muted small">Defina seu propósito, período e acompanhe cada etapa.</p><button class="btn wide" onclick="addSectionItem(\'purposes\',\'Qual é seu propósito ou oração?\')">＋ Novo propósito</button>'+sectionItems('purposes',s)+'</div><div class="card"><h3>🌿 Jejum</h3><p class="muted small">Registre sua intenção, período e reflexões. Jejum alimentar exige atenção à saúde e não é indicado para todas as pessoas.</p><button class="btn wide" onclick="addSectionItem(\'fasts\',\'Qual jejum ou prática espiritual deseja registrar?\')">＋ Registrar jejum</button>'+sectionItems('fasts',s)+'</div>'}else{h+='<div class="card"><h3>🎯 Objetivos desta área</h3><button class="btn wide" onclick="addSectionItem(\'purposes\',\'Qual objetivo deseja registrar?\')">＋ Novo objetivo</button>'+sectionItems('purposes',s)+'</div><div class="card"><h3>✓ Hábitos e compromissos</h3><button class="btn outline wide" onclick="addSectionItem(\'reading\',\'Qual hábito ou compromisso?\')">＋ Adicionar hábito</button>'+sectionItems('reading',s)+'</div>'}h+='<h3>Sonhos vinculados</h3><div class="grid">'+data.dreams.filter(d=>d.category===level).map(dreamCard).join('')+'</div><p><button class="btn outline wide" onclick="go(\'levels\')">Voltar à pirâmide</button></p>';}
else if(page==='dreams')h=head('Sonhos & Conquistas','Transforme desejos em realidade.')+'<div class="grid">'+data.dreams.map(dreamCard).join('')+'</div><p><button class="btn wide" onclick="go(\'add\')">＋ Adicionar sonho</button></p>';
else if(page==='add')h=head('Novo Sonho','O primeiro passo para conquistar.')+'<form onsubmit="createDream(event)"><label>Nome do sonho</label><input class="field" name="nome" required placeholder="Ex.: Meu carro novo"><label>Ícone ou emoji</label><input class="field" name="emoji" placeholder="🚙" maxlength="8"><label>Área da vida</label><select class="field" name="category">'+data.levels.map(l=>'<option>'+esc(l)+'</option>').join('')+'</select><label>Valor da meta (R$)</label><input class="field" type="number" min="0" step="0.01" name="target" placeholder="50000"><label>Quanto já tenho (R$)</label><input class="field" type="number" min="0" step="0.01" name="saved" placeholder="0"><button class="btn wide">Salvar meu sonho</button></form>';
else if(page==='detail'){const d=data.dreams.find(x=>x.id===selected);if(!d){go('dreams');return}h=head('Detalhe do Sonho','Meu plano de conquista')+'<div class="card center"><div style="font-size:90px">'+esc(d.emoji)+'</div><h2>'+esc(d.name)+'</h2><span class="pill">'+esc(d.category)+'</span></div><div class="card"><div class="row"><span>Meta</span><b>'+money(d.target)+'</b></div><div class="row"><span>Reservado</span><b>'+money(d.saved)+'</b></div>'+bar(pct(d))+'<div class="gold center">'+pct(d)+'% concluído</div></div><div class="row"><button class="btn" onclick="addValue('+d.id+')">＋ Adicionar valor</button><button class="btn outline" onclick="editDream('+d.id+')">Editar</button></div><h3>Plano de Ação</h3>'+d.tasks.map((t,i)=>'<div class="item"><label><input type="checkbox" '+(data.tasksDone.includes(d.id+':'+i)?'checked':'')+' onchange="toggleTask('+d.id+','+i+')"> '+esc(t)+'</label></div>').join('')+'<button class="btn outline wide" onclick="addTask('+d.id+')">＋ Adicionar tarefa</button><p><button class="btn outline wide" onclick="deleteDream('+d.id+')">Excluir sonho</button></p>'}
else if(page==='profile')h=head('Meu Perfil','Preferências e segurança')+'<div class="card center"><div class="avatar" style="margin:auto;width:75px;height:75px;font-size:30px">'+esc(data.name[0]||'A')+'</div><h2>'+esc(data.name)+'</h2><span class="pill">Membro ASCEND</span></div><div class="item">Meus objetivos: '+total+'</div><div class="item">Conquistas: '+done+'</div><div class="item">Evolução média: '+average+'%</div><button class="btn outline wide" onclick="go(\'evolution\')">Ver minha evolução</button><p><button class="btn outline wide" onclick="go(\'community\')">Comunidade ASCEND</button></p><p class="muted small">Esta versão é uma demonstração local, sem autenticação online.</p>';
else if(page==='evolution')h=head('Minha Evolução','Seu progresso por objetivo')+data.dreams.map(d=>'<div class="card"><div class="row"><b>'+esc(d.name)+'</b><span class="gold">'+pct(d)+'%</span></div>'+bar(pct(d))+'</div>').join('');
else if(page==='community')h=head('Comunidade ASCEND','Um espaço para inspirar conquistas')+'<div class="card"><h3>Em desenvolvimento</h3><p class="muted">A comunidade será ativada quando houver cadastro seguro, perfis e controles de privacidade.</p></div>';
$('app').innerHTML=h}
function openLevel(i){selectedLevel=data.levels[i];go('section')}function saveNotes(){data.sections[selectedLevel]=data.sections[selectedLevel]||{notes:'',purposes:[],fasts:[],reading:[]};data.sections[selectedLevel].notes=document.getElementById('section-notes').value;save();toast('Anotações salvas')}function sectionItems(type,s){return (s[type]||[]).map((x,i)=>'<div class="item row"><label style="flex:1"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleSectionItem(\''+type+'\','+i+')"> '+esc(x.text)+'</label><button class="btn outline" onclick="deleteSectionItem(\''+type+'\','+i+')">×</button></div>').join('')}function addSectionItem(type,msg){let v=prompt(msg);if(!v?.trim())return;let s=data.sections[selectedLevel]||(data.sections[selectedLevel]={notes:'',purposes:[],fasts:[],reading:[]});s[type]=s[type]||[];s[type].push({text:v.trim(),done:false,date:new Date().toISOString()});save();render()}function toggleSectionItem(type,i){let x=data.sections[selectedLevel][type][i];x.done=!x.done;save();render()}function deleteSectionItem(type,i){if(!confirm('Excluir este registro?'))return;data.sections[selectedLevel][type].splice(i,1);save();render()}function move(i,step){let j=i+step;if(j<0||j>=data.levels.length)return;[data.levels[i],data.levels[j]]=[data.levels[j],data.levels[i]];save();render()}function renameLevel(i){let v=prompt('Novo nome do nível',data.levels[i]);if(v?.trim()){data.levels[i]=v.trim();save();render()}}function addLevel(){let v=prompt('Nome do novo nível');if(v?.trim()){data.levels.push(v.trim());save();render()}}function removeLevel(i){if(confirm('Excluir este nível? Os sonhos existentes serão mantidos.')){data.levels.splice(i,1);save();render()}}function createDream(e){e.preventDefault();const f=e.target;let d={id:Date.now(),name:f.elements.nome.value.trim(),emoji:f.elements.emoji.value.trim()||'⭐',category:f.elements.category.value,target:Number(f.elements.target.value)||0,saved:Number(f.elements.saved.value)||0,tasks:[]};data.dreams.push(d);save();go('detail',d.id)}function addValue(id){let d=data.dreams.find(x=>x.id===id),v=prompt('Quanto deseja adicionar em R$?');if(v!==null&&Number(v.replace(',','.'))>0){d.saved+=Number(v.replace(',','.'));save();render()}}function editDream(id){let d=data.dreams.find(x=>x.id===id),v=prompt('Nome do sonho',d.name);if(v?.trim()){d.name=v.trim();save();render()}}function addTask(id){let d=data.dreams.find(x=>x.id===id),v=prompt('Nova tarefa');if(v?.trim()){d.tasks.push(v.trim());save();render()}}function toggleTask(id,i){let k=id+':'+i;data.tasksDone=data.tasksDone.includes(k)?data.tasksDone.filter(x=>x!==k):[...data.tasksDone,k];save()}function deleteDream(id){if(confirm('Excluir este sonho?')){data.dreams=data.dreams.filter(x=>x.id!==id);save();go('dreams')}}render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('install-app');if(b)b.style.display='block'});async function installAscend(){if(!installPrompt){alert('No Android, abra o menu do Chrome e escolha Instalar app ou Adicionar à tela inicial. No iPhone, use Compartilhar > Adicionar à Tela de Início.');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}</script><button id="install-app" onclick="installAscend()" style="position:fixed;right:12px;top:10px;z-index:8;border:1px solid #b98c43;background:#19150e;color:#f7d68d;border-radius:18px;padding:8px 12px;font-size:11px">⬇ Instalar ASCEND</button></body></html>
